# ANYWHERE Release Workflow
#
# 触发方式：推送 git tag（形如 v1.0.0），或在 Actions 页面手动运行
# 流程：构建 Windows NSIS 安装包 →（可选）SignPath 签名 → 重算 latest.yml → 发布 GitHub Release
#
# 自动更新：客户端从 GitHub Releases 读取 latest.yml（electron-updater github provider），
# 不需要自建更新服务器。
#
# 签名是可选的：没有配置 Secret 时自动跳过，直接发布未签名安装包。
# SignPath Foundation 申请通过后，在仓库 Settings → Secrets and variables → Actions 添加：
#   SIGNPATH_API_TOKEN        — SignPath 控制台的 CI API Token
#   SIGNPATH_ORGANIZATION_ID  — SignPath 组织 UUID
#   SIGNPATH_PROJECT_SLUG     — SignPath 项目 slug
#   SIGNPATH_SIGNING_POLICY   — 先用 test-signing 测试，上线时改成 release-signing

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # secrets 不能直接写进 if 表达式，先转成 env 再判断
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Windows 安装包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run dist:ci
          if (-not (Test-Path release/anywhere-setup.exe)) { Write-Error "未找到 NSIS 安装包"; exit 1 }
          if (-not (Test-Path release/latest.yml)) { Write-Error "未找到 latest.yml"; exit 1 }

      - name: 提交给 SignPath 签名（未配置时跳过）
        id: sign
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy: ${{ secrets.SIGNPATH_SIGNING_POLICY }}
          artifact-config: |
            [{
              "path": "release/anywhere-setup.exe",
              "signNextBuild": true,
              "description": "ANYWHERE Windows NSIS installer"
            }]
          wait-for-completion: true
          max-wait: 1200
          output-directory: signed

      - name: 使用已签名安装包并重算 latest.yml
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: bash
        run: |
          cp signed/anywhere-setup.exe release/anywhere-setup.exe
          node scripts/postsign-latest.mjs release/latest.yml release/anywhere-setup.exe

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ANYWHERE ${{ github.ref_name }}
          body: |
            ## ANYWHERE ${{ github.ref_name }}

            MIT 许可证 · 内嵌浏览器 · 素材库 · 内容流 · 跨站搜索矩阵

            **安装说明**：安装包暂未做代码签名，Windows 可能提示「未知发布者」，
            点击「更多信息」→「仍要运行」即可。
          files: |
            release/anywhere-setup.exe
            release/latest.yml
          fail_on_unmatched_files: true
